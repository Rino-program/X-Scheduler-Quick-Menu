name: Package Release ZIP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read extension version
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release archive
        run: |
          mkdir -p dist
          ARCHIVE_NAME="X-Scheduler-Quick-Menu-v${{ steps.version.outputs.value }}.zip"
          # -x で dist フォルダとすべての .zip ファイルを明確に除外します
          zip -r "dist/$ARCHIVE_NAME" . -x "dist/*" "*.zip" ".git/*" ".github/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: X-Scheduler-Quick-Menu-v${{ steps.version.outputs.value }}
          path: dist/*.zip

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
